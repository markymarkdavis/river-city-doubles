# Daily ping to POST /api/cron/notifications (see app.py).
# Server only sends mail for today's handicap season year and relevant week(s).
#
# Scheduled runs only work when:
#   • This file is on the repo default branch (main)
#   • Actions are enabled (Settings → Actions → General)
#   • The workflow is not disabled (Actions → Daily notification cron → ⋯ → Enable)
# Manual runs (workflow_dispatch) do not prove the schedule is enabled — check the runs list
# for events labeled "schedule", not only "workflow_dispatch".
#
# Schedule: GitHub Actions cron is UTC-only. This runs at 15:05 UTC, which is:
#   • 10:05 AM US Eastern Standard Time (roughly Nov–Mar)
#   • 11:05 AM US Eastern Daylight Time (roughly Mar–Nov)
# To target 10:05 AM Eastern during daylight saving instead, use: '5 14 * * *'
# (that is 9:05 AM during standard time). Pick the line that fits your season.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   NOTIFICATIONS_CRON_URL   — full URL, e.g. https://YOUR-APP.onrender.com/api/cron/notifications
#   NOTIFICATIONS_CRON_SECRET — must match RCD_CRON_SECRET on your Render (or other) host
#
# Manual run: Actions → "Daily notification cron" → Run workflow

name: Daily notification cron

on:
  schedule:
    # 15:05 UTC — see timezone note at top of file
    - cron: "5 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notifications-cron
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Run notification checks on server
        env:
          CRON_URL: ${{ secrets.NOTIFICATIONS_CRON_URL }}
          CRON_SECRET: ${{ secrets.NOTIFICATIONS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Add Actions secrets NOTIFICATIONS_CRON_URL and NOTIFICATIONS_CRON_SECRET (same secret value as RCD_CRON_SECRET on the server)."
            exit 1
          fi
          echo "POST $CRON_URL"
          http_code=$(curl -sS -o /tmp/cron-response.json -w "%{http_code}" -X POST "$CRON_URL" \
            -H "X-RCD-Cron: $CRON_SECRET" \
            -H "Accept: application/json")
          echo "HTTP $http_code"
          cat /tmp/cron-response.json
          echo ""
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron request failed with HTTP $http_code (see response body above)"
            exit 1
          fi
          echo "OK"
