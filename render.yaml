# Render Blueprint — SQLite on a persistent disk so scores and email subscriptions
# survive deploys and restarts. Persistent disks are not available on the Free web tier;
# this uses the Starter plan. See README "Persist database on Render".
#
# If you already have a manually created web service, do not duplicate it: instead open
# that service in the Dashboard → Disks → add a disk, mount e.g. /var/data, set
# RCD_DB=/var/data/scores.db under Environment, then redeploy.
#
# Email notifications: after first deploy, open the web service → Environment and set
# RCD_EMAIL_FROM + RCD_RESEND_API_KEY (recommended), or RCD_SMTP_* instead — see .env.example
# and README "Outbound email". Optional: RCD_CRON_SECRET for POST /api/cron/notifications.
#
# If you created the web service manually (not from this blueprint), add two Cron Jobs with
# startCommand: python scripts/run_notification_cron.py and RCD_CRON_SECRET (same as web):
#   • "0 13 * * *" (13:00 UTC = 8:00 AM EST) — match reminders
#   • "0 1 * * *" (01:00 UTC = 8:00 PM EST) — standings digests

services:
  - type: web
    name: river-city-doubles
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 90 app:app
    healthCheckPath: /health
    envVars:
      - key: RCD_DB
        value: /var/data/scores.db
      - key: RCD_EMAIL_FROM
        sync: false
      - key: RCD_RESEND_API_KEY
        sync: false
      - key: RCD_BREVO_API_KEY
        sync: false
      - key: RCD_CRON_SECRET
        sync: false
      - key: RCD_NOTIFICATION_TEST_SECRET
        sync: false
    disk:
      name: rcd-sqlite
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: river-city-doubles-notifications-morning
    runtime: python
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_notification_cron.py
    envVars:
      - key: RCD_CRON_SECRET
        sync: false
      - key: RCD_NOTIFICATIONS_CRON_URL
        value: https://river-city-doubles.onrender.com/api/cron/notifications

  - type: cron
    name: river-city-doubles-notifications-evening
    runtime: python
    schedule: "0 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_notification_cron.py
    envVars:
      - key: RCD_CRON_SECRET
        sync: false
      - key: RCD_NOTIFICATIONS_CRON_URL
        value: https://river-city-doubles.onrender.com/api/cron/notifications
